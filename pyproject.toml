[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dynow-vision"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["transformers", "torch", "torchvision", "numpy", "pillow", "matplotlib", "scikit-learn", "pyyaml"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
